spring.application.name=dentavista
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite (se crea sola junto al ejecutable)
spring.datasource.url=jdbc:sqlite:dentavista.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Registro de actividad
logging.level.root=WARN
logging.level.com.dentavista=INFO

# Datos de demostracion (pacientes con historia clinica). Idempotente: si ya hay
# datos no duplica nada. Ponlo en false para empezar con la base vacia.
app.demo.enabled=true

# Datos del consultorio (aparecen en la interfaz y en los PDF)
